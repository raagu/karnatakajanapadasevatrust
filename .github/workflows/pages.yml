name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require GitHub Actions as the publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publishing_source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [[ "$publishing_source" != "workflow" ]]; then
            echo "::error::Pages is configured to publish from a branch. In Settings > Pages > Build and deployment > Source, select GitHub Actions, then rerun this workflow. Publishing main/(root) serves the README instead of the built website."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install test dependencies
        run: npm ci

      - name: Install browser for verification
        run: npx playwright install --with-deps chromium

      - name: Refresh the static collection
        run: npm run refresh-content

      - name: Build the local test preview
        run: npm run build

      - name: Test the website and project-path build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/kjst-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ > /dev/null
          npm test

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Create the deployment artifact only after validation succeeds.
      - name: Build for the actual Pages address
        run: npm run build
        env:
          # Pages may report HTTP while HTTPS enforcement is still disabled.
          SITE_URL: https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}

      - name: Upload the built website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
